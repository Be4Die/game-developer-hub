version: v2

lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - ENUM_VALUE_PREFIX
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      - google/api/annotations.proto
      - google/api/http.proto

breaking:
  use:
    - FILE
