# ═══════════════════════════════════════════════════════════════
#  Game Developer Hub — Центральный стек бэкенда (Core Platform)
#
#  Инфраструктура:
#    postgres  — единая БД (orchestrator, sso, project-manager, moderation)
#    valkey    — единое KV (orchestrator: db=0, sso: db=1, project-manager: db=2)
#
#  Сервисы:
#    orchestrator     — gRPC API оркестратора (:50052)
#    sso              — gRPC API аутентификации (:50051)
#    project-manager  — gRPC API управления проектами (:50053)
#    moderation       — gRPC API модерации и чата проектов (:50054)
#    gateway          — gRPC-gateway HTTP/REST → gRPC (:8080)
#    nginx            — Nginx веб-сервер, обратный прокси и SSL (:80, :443)
#
#  Использование:
#    docker compose -f docker-compose.backend.yml up -d
#    docker compose -f docker-compose.backend.yml down -v
# ═══════════════════════════════════════════════════════════════

name: gdh-backend

services:
  # ── Инфраструктура БД и KV ────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: gdh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Миграции применяются при первом старте
      - ../src/orchestrator/migrations/init.sql:/docker-entrypoint-initdb.d/01-orchestrator.sql:ro
      - ../src/sso/migrations/init.sql:/docker-entrypoint-initdb.d/02-sso.sql:ro
      - ../src/project-manager/migrations/init.sql:/docker-entrypoint-initdb.d/03-project-manager.sql:ro
      - ../src/moderation/migrations/init.sql:/docker-entrypoint-initdb.d/04-moderation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: gdh-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Сервисы ядра платформы ────────────────────────────────────

  orchestrator:
    build:
      context: ../src
      dockerfile: orchestrator/Dockerfile
    container_name: gdh-orchestrator
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "50052:50052"
    environment:
      CONFIG_PATH: /app/config/local.yaml
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ../src/orchestrator/config:/app/config:ro
      - builds:/app/data/builds
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50052 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sso:
    build:
      context: ../src
      dockerfile: sso/Dockerfile
    container_name: gdh-sso
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      CONFIG_PATH: /app/config/docker.yaml
      SSO_API_KEY: dev-api-key-for-local-testing
      JWT_SECRET: dev-jwt-secret-for-local-testing
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ../src/sso/config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  project-manager:
    build:
      context: ../src
      dockerfile: project-manager/Dockerfile
    container_name: gdh-project-manager
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONFIG_PATH: /app/config/docker.yaml
      JWT_SECRET: dev-jwt-secret-for-local-testing
      MODERATION_GRPC_ADDR: gdh-moderation:50054
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-agent}
      DEPLOYMENT_AGENT_ENDPOINT: ${DEPLOYMENT_AGENT_ENDPOINT:-host.docker.internal:50055}
      DEPLOYMENT_AGENT_API_KEY: ${DEPLOYMENT_AGENT_API_KEY:-dev-deployment-agent-key}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50053:50053"
    volumes:
      - project_data:/data/projects
      - games_data:/data/games
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50053 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  moderation:
    build:
      context: ../src
      dockerfile: moderation/Dockerfile
    container_name: gdh-moderation
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config/docker.yaml
      JWT_SECRET: dev-jwt-secret-for-local-testing
      PROJECT_MANAGER_GRPC_ADDR: gdh-project-manager:50053
    depends_on:
      postgres:
        condition: service_healthy
      project-manager:
        condition: service_healthy
    ports:
      - "50054:50054"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50054 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: ../src
      dockerfile: gateway/Dockerfile
    container_name: gdh-gateway
    restart: unless-stopped
    environment:
      ORCHESTRATOR_GRPC_ADDR: gdh-orchestrator:50052
      SSO_GRPC_ADDR: gdh-sso:50051
      PROJECT_MANAGER_GRPC_ADDR: gdh-project-manager:50053
      MODERATION_GRPC_ADDR: gdh-moderation:50054
      HTTP_ADDR: :8080
      PROJECTS_DATA_PATH: /data/projects
    ports:
      - "8080:8080"
    depends_on:
      orchestrator:
        condition: service_healthy
      sso:
        condition: service_healthy
      project-manager:
        condition: service_healthy
      moderation:
        condition: service_healthy
    volumes:
      - project_data:/data/projects:ro

  nginx:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    container_name: gdh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - games_data:/data/games:ro
      - project_data:/data/projects:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  builds:
  project_data:
  games_data:
