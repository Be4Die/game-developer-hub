upstream s3_backend {
    server host.docker.internal:8333;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name localhost;

    # SSL configuration for localhost
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large build uploads (up to 2GB)
    client_max_body_size 2048m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA — all frontend routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets with hash in filename — immutable caching for 1 year
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?|ttf|ttc|otf|eot|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to gRPC-gateway
    # Orchestrator: /api/orchestrator/v1/...
    # SSO Auth:     /api/v1/auth/...
    # SSO User:     /api/v1/users/...
    # SSO Token:    /api/v1/tokens/...
    # Projects:     /api/v1/projects/...
    location ^~ /api/ {
        proxy_pass http://gdh-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward authentication headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;

        # SSE & Long-lived streams (instance logs)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
    }

    # Static media files (uploaded project media: icons, covers, videos)
    # Mode 1 & 2: local filesystem /data/projects/media/
    # Mode 3: S3 fallback via @s3_media
    location ^~ /media/ {
        alias /data/projects/media/;

        # Caching and CORS
        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri @s3_media;
    }

    location @s3_media {
        proxy_pass http://s3_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";

        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Hosted Web Games (Dev & Prod builds)
    # Mode 1 & 2: local filesystem /data/games/
    # Mode 3: S3 fallback via @s3_games
    location ^~ /games/ {
        root /data;

        # Content-Encoding & MIME types for Unity WebGL / WASM / Brotli / Gzip from disk
        location ~* \.wasm\.br$ {
            add_header Content-Type application/wasm;
            add_header Content-Encoding br;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.data\.br$ {
            add_header Content-Type application/octet-stream;
            add_header Content-Encoding br;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.framework\.js\.br$ {
            add_header Content-Type application/javascript;
            add_header Content-Encoding br;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.js\.br$ {
            add_header Content-Type application/javascript;
            add_header Content-Encoding br;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.wasm\.gz$ {
            add_header Content-Type application/wasm;
            add_header Content-Encoding gzip;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.data\.gz$ {
            add_header Content-Type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.framework\.js\.gz$ {
            add_header Content-Type application/javascript;
            add_header Content-Encoding gzip;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.js\.gz$ {
            add_header Content-Type application/javascript;
            add_header Content-Encoding gzip;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            add_header Access-Control-Allow-Origin "*";
            try_files $uri @s3_games;
        }
        location ~* \.symbols\.json\.br$ {
            add_header Content-Type application/json;
            add_header Content-Encoding br;
            try_files $uri @s3_games;
        }
        location ~* \.symbols\.json\.gz$ {
            add_header Content-Type application/json;
            add_header Content-Encoding gzip;
            try_files $uri @s3_games;
        }

        # CORS for web games
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Content-Encoding" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Encoding" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri $uri/ @s3_games;
    }

    location @s3_games {
        # If directory or version path requested without index.html, append index.html
        rewrite ^(/games/[^/]+/[^/]+)$ $1/index.html break;
        rewrite ^(/games/.*/)$ $1index.html break;

        proxy_pass http://s3_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";

        # SeaweedFS / S3 returns Content-Type and Content-Encoding stored during upload
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Content-Encoding" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Encoding" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        expires 7d;
    }
}
