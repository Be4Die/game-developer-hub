# Конфигурация для запуска в Docker Compose
env: "dev"

grpc:
  port: 50054

db:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "orchestrator"
  ssl_mode: "disable"

project_manager:
  addr: "gdh-project-manager:50053"

orchestrator:
  addr: "gdh-orchestrator:50052"

jwt:
  secret: "dev-jwt-secret-for-local-testing"
  issuer: "sso"
