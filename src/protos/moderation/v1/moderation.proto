syntax = "proto3";

package moderation.v1;
option go_package = "github.com/Be4Die/game-developer-hub/protos/moderation/v1";

import "google/api/annotations.proto";

// RequestStatus статус рассмотрения заявки модератором.
enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_PENDING = 1;
  REQUEST_STATUS_IN_REVIEW = 2;
  REQUEST_STATUS_APPROVED = 3;
  REQUEST_STATUS_REJECTED = 4;
  REQUEST_STATUS_CANCELLED = 5;
}

// SenderRole роль отправителя сообщения в чате проекта.
enum SenderRole {
  SENDER_ROLE_UNSPECIFIED = 0;
  SENDER_ROLE_DEVELOPER = 1;
  SENDER_ROLE_MODERATOR = 2;
  SENDER_ROLE_SYSTEM = 3;
}

// MessageType тип сообщения в чате проекта.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_SUBMITTED = 2;
  MESSAGE_TYPE_STATUS_CHANGED = 3;
  MESSAGE_TYPE_APPROVED = 4;
  MESSAGE_TYPE_REJECTED = 5;
}

// ProjectSnapshot снимок состояния черновика на момент отправки на модерацию.
message ProjectSnapshot {
  int64 project_id = 1;
  string title_ru = 2;
  string title_en = 3;
  string seo_ru = 4;
  string seo_en = 5;
  string about_ru = 6;
  string icon_path = 7;
  string cover_path = 8;
  string video_path = 9;
  string active_build_version = 10;
  string dev_url = 11;
  string about_en = 12;
}

// ModerationRequest сущность запроса на модерацию проекта.
message ModerationRequest {
  int64 id = 1;
  int64 project_id = 2;
  string owner_id = 3;
  string moderator_id = 4;
  RequestStatus status = 5;
  ProjectSnapshot snapshot = 6;
  string rejection_reason = 7;
  string submitted_at = 8;
  string started_review_at = 9;
  string resolved_at = 10;
}

// AttachmentInfo информация о медиа-вложении (фото или видео).
message AttachmentInfo {
  string id = 1;
  int64 project_id = 2;
  int64 message_id = 3;
  string file_name = 4;
  int64 file_size = 5;
  string mime_type = 6;
  string url = 7;
  string download_url = 8;
  bool is_purged = 9;
  string created_at = 10;
}

// ViolationItem пункт нарушения правил модерации.
message ViolationItem {
  string rule_code = 1;
  string rule_title = 2;
  string description = 3;
  repeated string attachment_ids = 4;
  repeated AttachmentInfo attachments = 5;
}

// ChatMessage сообщение или системное событие в чате проекта.
message ChatMessage {
  int64 id = 1;
  int64 project_id = 2;
  int64 request_id = 3;
  string sender_id = 4;
  SenderRole sender_role = 5;
  MessageType message_type = 6;
  string content = 7;
  string created_at = 8;
  repeated AttachmentInfo attachments = 9;
  string payload_json = 10;
}

// ─── Запросы и Ответы ─────────────────────────────────────────

message SubmitDraftRequest {
  int64 project_id = 1;
  string owner_id = 2;
  ProjectSnapshot snapshot = 3;
}

message SubmitDraftResponse {
  bool success = 1;
  ModerationRequest request = 2;
}

message ListModerationRequestsRequest {
  RequestStatus status = 1;
  string moderator_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListModerationRequestsResponse {
  repeated ModerationRequest requests = 1;
  int32 total = 2;
}

message GetModerationRequestRequest {
  int64 request_id = 1;
}

message GetModerationRequestResponse {
  ModerationRequest request = 1;
}

message GetLatestRequestByProjectRequest {
  int64 project_id = 1;
}

message ClaimModerationRequestRequest {
  int64 request_id = 1;
}

message ClaimModerationRequestResponse {
  ModerationRequest request = 1;
}

message ApproveModerationRequest {
  int64 project_id = 1;
  string comment = 2;
}

message ApproveModerationResponse {
  bool success = 1;
  ModerationRequest request = 2;
  string prod_url = 3;
}

message RejectModerationRequest {
  int64 project_id = 1;
  string reason = 2;
  repeated ViolationItem violations = 3;
}

message RejectModerationResponse {
  bool success = 1;
  ModerationRequest request = 2;
}

message SendChatMessageRequest {
  int64 project_id = 1;
  string content = 2;
  repeated string attachment_ids = 3;
  string payload_json = 4;
}

message SendChatMessageResponse {
  ChatMessage message = 1;
}

message ListChatMessagesRequest {
  int64 project_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListChatMessagesResponse {
  repeated ChatMessage messages = 1;
  int32 total = 2;
}

message ChatSummary {
  int64 project_id = 1;
  ChatMessage last_message = 2;
}

message ListActiveChatsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListActiveChatsResponse {
  repeated ChatSummary chats = 1;
  int32 total = 2;
}

message CloseDialogRequest {
  int64 project_id = 1;
  string comment = 2;
}

message CloseDialogResponse {
  bool success = 1;
  ChatMessage message = 2;
}

// ─── Статистика и журнал действий модератора ─────────────────

// ModeratorStats агрегированные статистические показатели работы модератора.
message ModeratorStats {
  string moderator_id = 1;
  int32 total_assigned = 2;              // Всего закреплено (in_review + approved + rejected)
  int32 in_review_count = 3;             // На проверке прямо сейчас
  int32 approved_count = 4;              // Одобрено
  int32 rejected_count = 5;              // Отклонено
  int32 total_resolved = 6;              // Всего вынесено решений (approved + rejected)
  double approval_rate = 7;              // Доля одобренных, % (0.0 - 100.0)
  double rejection_rate = 8;             // Доля отклоненных, % (0.0 - 100.0)
  int64 avg_review_duration_seconds = 9; // Средняя длительность рассмотрения заявки в секундах
  int32 messages_sent = 10;              // Сообщений отправлено в чатах проектов
  int32 today_resolved = 11;             // Рассмотрено за сегодня
  int32 week_resolved = 12;              // Рассмотрено за текущую неделю
  int32 month_resolved = 13;             // Рассмотрено за текущий месяц
}

message GetModeratorStatsRequest {
  string moderator_id = 1;
}

message GetModeratorStatsResponse {
  ModeratorStats stats = 1;
}

message ListModeratorsStatsRequest {
}

message ListModeratorsStatsResponse {
  repeated ModeratorStats stats = 1;
}

// ModeratorActivityItem запись в журнале действий модератора.
message ModeratorActivityItem {
  int64 id = 1;
  int64 project_id = 2;
  string action_type = 3;     // "chat_message", "dialog_closed", "approved", "rejected", "claimed"
  string action_title = 4;    // "Сообщение в чате", "Вопрос решён", "Одобрение проекта", "Отклонение заявки", "Взятие на проверку"
  string project_title = 5;   // Название игры
  string project_icon = 6;    // Иконка игры
  string build_version = 7;   // Версия билда
  string details = 8;         // Текст сообщения / причина отказа / комментарий
  string created_at = 9;      // Timestamp совершения действия
}

message ListModeratorActivityRequest {
  string moderator_id = 1;
  string action_type = 2;     // Фильтр: "" (все), "chat_message", "dialog_closed", "approved", "rejected", "claimed"
  int32 limit = 3;
  int32 offset = 4;
}

message ListModeratorActivityResponse {
  repeated ModeratorActivityItem items = 1;
  int32 total = 2;
}

message RegisterAttachmentRequest {
  string id = 1;
  int64 project_id = 2;
  string uploader_id = 3;
  SenderRole uploader_role = 4;
  string file_name = 5;
  int64 file_size = 6;
  string mime_type = 7;
  string storage_path = 8;
}

message RegisterAttachmentResponse {
  AttachmentInfo attachment = 1;
}

message GetAttachmentRequest {
  string attachment_id = 1;
  int64 project_id = 2;
}

message GetAttachmentResponse {
  AttachmentInfo attachment = 1;
}

message PurgeProjectMediaRequest {
  int64 project_id = 1;
}

message PurgeProjectMediaResponse {
  bool success = 1;
  int32 purged_count = 2;
}

// ─── Сервис ───────────────────────────────────────────────────

service ModerationService {
  rpc SubmitDraft(SubmitDraftRequest) returns (SubmitDraftResponse);

  rpc ListRequests(ListModerationRequestsRequest) returns (ListModerationRequestsResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/requests" };
  }

  rpc GetRequest(GetModerationRequestRequest) returns (GetModerationRequestResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/requests/{request_id}" };
  }

  rpc GetLatestRequestByProject(GetLatestRequestByProjectRequest) returns (GetModerationRequestResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/projects/{project_id}/latest" };
  }

  rpc ClaimRequest(ClaimModerationRequestRequest) returns (ClaimModerationRequestResponse) {
    option (google.api.http) = { post: "/api/v1/moderation/requests/{request_id}/claim", body: "*" };
  }

  rpc Approve(ApproveModerationRequest) returns (ApproveModerationResponse) {
    option (google.api.http) = { post: "/api/v1/moderation/projects/{project_id}/approve", body: "*" };
  }

  rpc Reject(RejectModerationRequest) returns (RejectModerationResponse) {
    option (google.api.http) = { post: "/api/v1/moderation/projects/{project_id}/reject", body: "*" };
  }

  rpc SendMessage(SendChatMessageRequest) returns (SendChatMessageResponse) {
    option (google.api.http) = { post: "/api/v1/moderation/projects/{project_id}/messages", body: "*" };
  }

  rpc ListMessages(ListChatMessagesRequest) returns (ListChatMessagesResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/projects/{project_id}/messages" };
  }

  rpc ListActiveChats(ListActiveChatsRequest) returns (ListActiveChatsResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/chats" };
  }

  rpc CloseDialog(CloseDialogRequest) returns (CloseDialogResponse) {
    option (google.api.http) = { post: "/api/v1/moderation/projects/{project_id}/close-dialog", body: "*" };
  }

  rpc GetModeratorStats(GetModeratorStatsRequest) returns (GetModeratorStatsResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/moderators/{moderator_id}/stats" };
  }

  rpc ListModeratorsStats(ListModeratorsStatsRequest) returns (ListModeratorsStatsResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/moderators/stats" };
  }

  rpc ListModeratorActivity(ListModeratorActivityRequest) returns (ListModeratorActivityResponse) {
    option (google.api.http) = { get: "/api/v1/moderation/moderators/{moderator_id}/activity" };
  }

  rpc RegisterAttachment(RegisterAttachmentRequest) returns (RegisterAttachmentResponse);

  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);

  rpc PurgeProjectMedia(PurgeProjectMediaRequest) returns (PurgeProjectMediaResponse);
}

