version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Be4Die/game-developer-hub/protos

plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative

  - local: protoc-gen-grpc-gateway
    out: .
    opt:
      - paths=source_relative
      - generate_unbound_methods=false

  - local: protoc-gen-openapiv2
    out: ../gateway/docs
    opt:
      - allow_merge=true

  - local: ../frontend/node_modules/.bin/protoc-gen-ts_proto
    out: ../frontend/src/shared/types/generated
    opt:
      - stringEnums=true
      - esModuleInterop=true
      - onlyTypes=true
      - useDate=string
      - snakeToCamel=false
      - outputServices=false
