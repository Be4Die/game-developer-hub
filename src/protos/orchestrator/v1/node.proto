syntax = "proto3";
import "google/protobuf/timestamp.proto";

package orchestrator.v1;

import "google/api/annotations.proto";
import "orchestrator/v1/common.proto";

// Сервис управления вычислительными нодами.
service NodeService {
  // Подключить вычислительную ноду.
  rpc Register(NodeServiceRegisterRequest) returns (NodeServiceRegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes"
      body: "*"
    };
  }

  // Список всех нод.
  rpc List(NodeServiceListRequest) returns (NodeServiceListResponse) {
    option (google.api.http) = {get: "/api/v1/nodes"};
  }

  // Информация о ноде.
  rpc Get(NodeServiceGetRequest) returns (NodeServiceGetResponse) {
    option (google.api.http) = {get: "/api/v1/nodes/{node_id}"};
  }

  // Удалить ноду.
  rpc Delete(NodeServiceDeleteRequest) returns (NodeServiceDeleteResponse) {
    option (google.api.http) = {delete: "/api/v1/nodes/{node_id}"};
  }

  // Потребление ресурсов ноды.
  rpc GetUsage(NodeServiceGetUsageRequest) returns (NodeServiceGetUsageResponse) {
    option (google.api.http) = {get: "/api/v1/nodes/{node_id}/usage"};
  }

  // Список инстансов на ноде.
  rpc ListInstances(NodeServiceListInstancesRequest) returns (NodeServiceListInstancesResponse) {
    option (google.api.http) = {get: "/api/v1/nodes/{node_id}/instances"};
  }

  // Анонсирование ноды. Нода сама заявляет о себе оркестратору.
  // Создает запись ноды со статусом UNAUTHORIZED и возвращает ID с токеном.
  rpc Announce(NodeServiceAnnounceRequest) returns (NodeServiceAnnounceResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/announce"
      body: "*"
    };
  }

  // Обновить роль ноды (Mixed, Compute, Storage).
  rpc UpdateRole(NodeServiceUpdateRoleRequest) returns (NodeServiceUpdateRoleResponse) {
    option (google.api.http) = {
      patch: "/api/v1/nodes/{node_id}/role"
      body: "*"
      additional_bindings {
        put: "/api/v1/nodes/{node_id}/role"
        body: "*"
      }
    };
  }

  // Развернуть управляемый сервис хранения данных на ноде.
  rpc CreateService(NodeServiceCreateServiceRequest) returns (NodeServiceCreateServiceResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}/services"
      body: "*"
    };
  }

  // Список управляемых сервисов на ноде.
  rpc ListServices(NodeServiceListServicesRequest) returns (NodeServiceListServicesResponse) {
    option (google.api.http) = {get: "/api/v1/nodes/{node_id}/services"};
  }

  // Удалить управляемый сервис на ноде.
  // Создать бэкап управляемого сервиса.
  rpc CreateServiceBackup(NodeServiceCreateServiceBackupRequest) returns (NodeServiceCreateServiceBackupResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}/services/{service_name}/backups"
      body: "*"
    };
  }

  // Получить список бэкапов.
  rpc ListServiceBackups(NodeServiceListServiceBackupsRequest) returns (NodeServiceListServiceBackupsResponse) {
    option (google.api.http) = {
      get: "/api/v1/nodes/{node_id}/services/{service_name}/backups"
    };
  }

  // Восстановить бэкап.
  rpc RestoreServiceBackup(NodeServiceRestoreServiceBackupRequest) returns (NodeServiceRestoreServiceBackupResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}/services/{service_name}/backups/{backup_id}/restore"
      body: "*"
    };
  }

  // Удалить бэкап управляемого сервиса.
  rpc DeleteServiceBackup(NodeServiceDeleteServiceBackupRequest) returns (NodeServiceDeleteServiceBackupResponse) {
    option (google.api.http) = {
      delete: "/api/v1/nodes/{node_id}/services/{service_name}/backups/{backup_id}"
    };
  }

  // Сгенерировать одноразовый тикет для защищенного скачивания бэкапа.
  rpc GetBackupTicket(NodeServiceGetBackupTicketRequest) returns (NodeServiceGetBackupTicketResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}/services/{service_name}/backups/{backup_id}/ticket"
      body: "*"
    };
  }

  // Скачать бэкап управляемого сервиса (стриминг чанков).
  rpc DownloadServiceBackup(NodeServiceDownloadServiceBackupRequest) returns (stream NodeServiceBackupChunk);

  // Загрузить бэкап управляемого сервиса (стриминг чанков).
  rpc UploadServiceBackup(stream NodeServiceUploadBackupChunk) returns (NodeServiceUploadBackupResponse);

  // Переключить статус бэкапов на ноде.
  rpc ToggleBackups(NodeServiceToggleBackupsRequest) returns (NodeServiceToggleBackupsResponse) {
    option (google.api.http) = {
      put: "/api/v1/nodes/{node_id}/backups/toggle"
      body: "*"
    };
  }

  // Переключить статус автобэкапов сервиса.
  rpc ToggleServiceAutoBackup(NodeServiceToggleServiceAutoBackupRequest) returns (NodeServiceToggleServiceAutoBackupResponse) {
    option (google.api.http) = {
      put: "/api/v1/nodes/{node_id}/services/{service_name}/auto-backup/toggle"
      body: "*"
    };
  }
  rpc DeleteService(NodeServiceDeleteServiceRequest) returns (NodeServiceDeleteServiceResponse) {
    option (google.api.http) = {delete: "/api/v1/nodes/{node_id}/services/{service_id}"};
  }

  // Запустить остановленный управляемый сервис.
  rpc StartService(NodeServiceStartServiceRequest) returns (NodeServiceStartServiceResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}/services/{service_id}/start"
      body: "*"
    };
  }

  // Остановить работающий управляемый сервис.
  rpc StopService(NodeServiceStopServiceRequest) returns (NodeServiceStopServiceResponse) {
    option (google.api.http) = {
      post: "/api/v1/nodes/{node_id}/services/{service_id}/stop"
      body: "*"
    };
  }
}

// ─── Register ───────────────────────────────────────────────────────────────

message RegisterNodeManual {
  string address = 1;
  string token = 2;
  optional string region = 3;
}

message RegisterNodeAuthorize {
  int64 node_id = 1;
  string token = 2;
}

message NodeServiceRegisterRequest {
  oneof mode {
    RegisterNodeManual manual = 1;
    RegisterNodeAuthorize authorize = 2;
  }
}

message NodeServiceRegisterResponse {
  Node node = 1;
}

// ─── List ───────────────────────────────────────────────────────────────────

message NodeServiceListRequest {
  optional NodeStatus status = 1;
}

message NodeServiceListResponse {
  repeated Node nodes = 1;
}

// ─── Get ────────────────────────────────────────────────────────────────────

message NodeServiceGetRequest {
  int64 node_id = 1;
}

message NodeServiceGetResponse {
  Node node = 1;
}

// ─── Delete ─────────────────────────────────────────────────────────────────

message NodeServiceDeleteRequest {
  int64 node_id = 1;
}

message NodeServiceDeleteResponse {
  // Пусто — при успехе возвращается пустой ответ.
}

// ─── GetUsage ───────────────────────────────────────────────────────────────

message NodeServiceGetUsageRequest {
  int64 node_id = 1;
}

message NodeServiceGetUsageResponse {
  int64 node_id = 1;
  ResourceUsage usage = 2;
  int32 active_instance_count = 3;
}

// ─── ListInstances ───────────────────────────────────────────────────────────

message NodeServiceListInstancesRequest {
  int64 node_id = 1;
}

message NodeServiceListInstancesResponse {
  repeated Instance instances = 1;
}

// ─── Announce ───────────────────────────────────────────────────────────────

message NodeServiceAnnounceRequest {
  // gRPC адрес ноды (host:port), по которому оркестратор будет подключаться.
  string address = 1;
  // Регион размещения ноды (опционально).
  optional string region = 2;
  // Версия агента ноды.
  string agent_version = 3;
  // Системная информация о ноде.
  uint32 cpu_cores = 4;
  uint64 total_memory_bytes = 5;
  uint64 total_disk_bytes = 6;
   // API-ключ ноды (NODE_API_KEY). Используется как токен авторизации:
   // пользователь вводит тот же NODE_API_KEY для подключения ноды.
   string api_key = 7;
   // Список ID активных контейнеров на ноде (для синхронизации при старте).
   repeated string active_container_ids = 8;
 }

message NodeServiceAnnounceResponse {
  // ID созданной ноды в оркестраторе.
  int64 node_id = 1;
}

// ─── UpdateRole ─────────────────────────────────────────────────────────────

enum StorageTransitionAction {
  STORAGE_TRANSITION_ACTION_UNSPECIFIED = 0;
  // Безопасная остановка: создание 100% бэкапа -> остановка контейнеров -> тома сохранены на диске
  STORAGE_TRANSITION_ACTION_STOP = 1;
  // Полная очистка: создание 100% бэкапа -> остановка -> удаление контейнеров и томов с диска
  STORAGE_TRANSITION_ACTION_DELETE = 2;
}

enum ComputeTransitionAction {
  COMPUTE_TRANSITION_ACTION_UNSPECIFIED = 0;
  // Остановка и удаление всех игровых серверов на ноде
  COMPUTE_TRANSITION_ACTION_TERMINATE = 1;
}

message NodeServiceUpdateRoleRequest {
  int64 node_id = 1;
  NodeRole role = 2;
  StorageTransitionAction storage_action = 3;
  ComputeTransitionAction compute_action = 4;
}

message NodeServiceUpdateRoleResponse {
  Node node = 1;
}

// ─── Managed Services ───────────────────────────────────────────────────────

message NodeServiceCreateServiceRequest {
  int64 node_id = 1;
  ServiceType type = 2 [json_name = "service_type"];
  string name = 3;
  repeated int64 allowed_game_ids = 4;
  optional string password = 5;
  optional string db_name = 6;
  uint32 port = 7;
}

message NodeServiceCreateServiceResponse {
  ManagedService service = 1;
}

message NodeServiceListServicesRequest {
  int64 node_id = 1;
  optional int64 game_id = 2;
}

message NodeServiceListServicesResponse {
  repeated ManagedService services = 1;
}

message NodeServiceDeleteServiceRequest {
  int64 node_id = 1;
  int64 service_id = 2;
  bool delete_volume = 3;
}

message NodeServiceDeleteServiceResponse {}


message NodeServiceToggleBackupsRequest {
  int64 node_id = 1;
  bool enabled = 2;
}

message NodeServiceToggleBackupsResponse {
  Node node = 1;
}

message NodeServiceToggleServiceAutoBackupRequest {
  int64 node_id = 1;
  string service_name = 2;
  bool enabled = 3;
}

message NodeServiceToggleServiceAutoBackupResponse {
  ManagedService service = 1;
}

// ─── Service Backups ─────────────────────────────────────────────────────────

enum BackupType {
  BACKUP_TYPE_UNSPECIFIED = 0;
  BACKUP_TYPE_MANUAL = 1;
  BACKUP_TYPE_UPLOADED = 2;
  BACKUP_TYPE_SCHEDULED = 3;
}

enum BackupStatus {
  BACKUP_STATUS_UNSPECIFIED = 0;
  BACKUP_STATUS_CREATING = 1;
  BACKUP_STATUS_READY = 2;
  BACKUP_STATUS_FAILED = 3;
  BACKUP_STATUS_RESTORING = 4;
}

message ServiceBackup {
  int64 id = 1;
  string backup_id = 2;
  int64 node_id = 3;
  int64 service_id = 4;
  string service_name = 5;
  ServiceType service_type = 6;
  string file_name = 7;
  int64 size_bytes = 8;
  string checksum = 9;
  BackupType backup_type = 10;
  BackupStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
}

message NodeServiceCreateServiceBackupRequest {
  int64 node_id = 1;
  string service_name = 2;
}
message NodeServiceCreateServiceBackupResponse {
  ServiceBackup backup = 1;
}

message NodeServiceListServiceBackupsRequest {
  int64 node_id = 1;
  string service_name = 2;
}
message NodeServiceListServiceBackupsResponse {
  repeated ServiceBackup backups = 1;
}

message NodeServiceRestoreServiceBackupRequest {
  int64 node_id = 1;
  string service_name = 2;
  string backup_id = 3;
}
message NodeServiceRestoreServiceBackupResponse {
  bool success = 1;
  string message = 2;
}

message NodeServiceDeleteServiceBackupRequest {
  int64 node_id = 1;
  string service_name = 2;
  string backup_id = 3;
}
message NodeServiceDeleteServiceBackupResponse {}

message NodeServiceGetBackupTicketRequest {
  int64 node_id = 1;
  string service_name = 2;
  string backup_id = 3;
}
message NodeServiceGetBackupTicketResponse {
  string ticket = 1;
  int64 expires_in_seconds = 2;
}

message NodeServiceDownloadServiceBackupRequest {
  int64 node_id = 1;
  string service_name = 2;
  string backup_id = 3;
}
message NodeServiceBackupChunk {
  bytes chunk = 1;
}

message NodeServiceUploadBackupChunk {
  oneof payload {
    NodeServiceUploadBackupMetadata metadata = 1;
    bytes chunk = 2;
  }
}
message NodeServiceUploadBackupMetadata {
  int64 node_id = 1;
  string service_name = 2;
  string file_name = 3;
  bool restore_immediately = 4;
}
message NodeServiceUploadBackupResponse {
  ServiceBackup backup = 1;
  bool restored = 2;
}

message NodeServiceStartServiceRequest {
  int64 node_id = 1;
  int64 service_id = 2;
}

message NodeServiceStartServiceResponse {
  ManagedService service = 1;
}

message NodeServiceStopServiceRequest {
  int64 node_id = 1;
  int64 service_id = 2;
}

message NodeServiceStopServiceResponse {
  ManagedService service = 1;
}
