syntax = "proto3";

package project_manager.v1;
option go_package = "github.com/Be4Die/game-developer-hub/protos/project_manager/v1";

import "google/api/annotations.proto";

// ProjectStatus статус жизненного цикла проекта.
enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_DRAFT = 1;
  PROJECT_STATUS_PENDING = 2;
  PROJECT_STATUS_PUBLISHED = 3;
  PROJECT_STATUS_REJECTED = 4;
}

// DeploymentEnvironment целевое окружение развёртывания.
enum DeploymentEnvironment {
  DEPLOYMENT_ENV_UNSPECIFIED = 0;
  DEPLOYMENT_ENV_DEV = 1;
  DEPLOYMENT_ENV_PROD = 2;
}

// DeploymentStatus статус выполнения развёртывания.
enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_PENDING = 1;
  DEPLOYMENT_STATUS_SUCCESS = 2;
  DEPLOYMENT_STATUS_FAILED = 3;
}

// ─── Доменные сообщения ───────────────────────────────────────

// Project сущность игрового проекта.
message Project {
  int64 id = 1;
  string owner_id = 2;
  string title_ru = 3;
  string title_en = 4;
  string seo_ru = 5;
  string seo_en = 6;
  string about_ru = 7;
  ProjectStatus status = 8;
  string icon_path = 9;
  string cover_path = 10;
  string video_path = 11;
  string active_build_version = 12;
  string dev_url = 13;
  string prod_url = 14;
  string created_at = 15;
  string updated_at = 16;
  ProjectDraft draft = 17;
  ProjectRelease release = 18;
  string about_en = 19;
  repeated string current_user_permissions = 20;
  bool is_owner = 21;
}

// ProjectDraft рабочее состояние черновика проекта.
message ProjectDraft {
  int64 project_id = 1;
  string title_ru = 2;
  string title_en = 3;
  string seo_ru = 4;
  string seo_en = 5;
  string about_ru = 6;
  string icon_path = 7;
  string cover_path = 8;
  string video_path = 9;
  string active_build_version = 10;
  string dev_url = 11;
  string updated_at = 12;
  string about_en = 13;
}

// ProjectRelease зафиксированный опубликованный релиз.
message ProjectRelease {
  int64 id = 1;
  int64 project_id = 2;
  string version = 3;
  string title_ru = 4;
  string title_en = 5;
  string seo_ru = 6;
  string seo_en = 7;
  string about_ru = 8;
  string icon_path = 9;
  string cover_path = 10;
  string video_path = 11;
  string prod_url = 12;
  string published_at = 13;
  string about_en = 14;
}

// ProjectBuild клиентский билд веб-игры.
message ProjectBuild {
  int64 id = 1;
  int64 project_id = 2;
  string version = 3;
  string file_path = 4;
  int64 file_size = 5;
  bool is_unpacked = 6;
  string created_at = 7;
}

// DeploymentRecord запись аудита развертывания.
message DeploymentRecord {
  int64 id = 1;
  int64 project_id = 2;
  DeploymentEnvironment environment = 3;
  string version = 4;
  DeploymentStatus status = 5;
  string error_message = 6;
  string deployed_at = 7;
}

// ─── Create ───────────────────────────────────────────
message ProjectCreateRequest {
  string title_ru = 1;
  string title_en = 2;
}

message ProjectCreateResponse {
  Project project = 1;
}

// ─── Get ──────────────────────────────────────────────
message ProjectGetRequest {
  int64 id = 1;
}

message ProjectGetResponse {
  Project project = 1;
}

// ─── List ─────────────────────────────────────────────
message ProjectListRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ProjectListResponse {
  repeated Project projects = 1;
  int32 total = 2;
}

// ─── Update ───────────────────────────────────────────
message ProjectUpdateRequest {
  int64 id = 1;
  string title_ru = 2;
  string title_en = 3;
  string seo_ru = 4;
  string seo_en = 5;
  string about_ru = 6;
  string active_build_version = 7;
  string about_en = 8;
}

message ProjectUpdateResponse {
  Project project = 1;
}

// ─── Delete ───────────────────────────────────────────
message ProjectDeleteRequest {
  int64 id = 1;
}

message ProjectDeleteResponse {
  bool success = 1;
}

// ─── Upload Build (Unary Fallback & Streaming) ────────
message ProjectUploadBuildRequest {
  int64 project_id = 1;
  string version = 2;
  bytes data = 3;
}

message ProjectUploadBuildStreamRequest {
  oneof payload {
    BuildUploadStreamMetadata metadata = 1;
    bytes chunk = 2; // Рекомендуемый размер чанка: 64 КБ
  }
}

message BuildUploadStreamMetadata {
  int64 project_id = 1;
  string version = 2;
}

message ProjectUploadBuildResponse {
  bool success = 1;
  ProjectBuild build = 2;
  string dev_url = 3;
}

// ─── List Builds ──────────────────────────────────────
message ProjectListBuildsRequest {
  int64 project_id = 1;
}

message ProjectListBuildsResponse {
  repeated ProjectBuild builds = 1;
}

// ─── Delete Build ─────────────────────────────────────
message ProjectDeleteBuildRequest {
  int64 project_id = 1;
  string version = 2;
}

message ProjectDeleteBuildResponse {
  bool success = 1;
}

// ─── Upload Media ─────────────────────────────────────
message ProjectUploadMediaRequest {
  int64 project_id = 1;
  string media_type = 2; // icon, cover, video
  bytes data = 3;
}

message ProjectUploadMediaStreamRequest {
  oneof payload {
    MediaUploadStreamMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message MediaUploadStreamMetadata {
  int64 project_id = 1;
  string media_type = 2;
}

message ProjectUploadMediaResponse {
  bool success = 1;
  string file_path = 2;
}

// ─── Moderation & Release ─────────────────────────────

message SubmitForModerationRequest {
  int64 project_id = 1;
}

message SubmitForModerationResponse {
  bool success = 1;
  int64 request_id = 2;
}

message ProjectPublishReleaseRequest {
  int64 project_id = 1;
  string version = 2;
  string published_by = 3;
  string comment = 4;
}

message ProjectPublishReleaseResponse {
  bool success = 1;
  ProjectRelease release = 2;
}

message ProjectRejectDraftRequest {
  int64 project_id = 1;
  string reason = 2;
}

message ProjectRejectDraftResponse {
  bool success = 1;
}

message ProjectGetPublishedRequest {
  int64 id = 1;
}

message ProjectGetPublishedResponse {
  ProjectRelease release = 1;
}

message ProjectUnpublishRequest {
  int64 id = 1;
}

message ProjectUnpublishResponse {
  bool success = 1;
}

// ─── Доступ и Участники ───────────────────────────────────────

enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_PENDING = 1;
  INVITATION_STATUS_ACCEPTED = 2;
  INVITATION_STATUS_DECLINED = 3;
  INVITATION_STATUS_CANCELED = 4;
}

message ProjectMember {
  int64 id = 1;
  int64 project_id = 2;
  string user_id = 3;
  string user_email = 4;
  string user_name = 5;
  repeated string permissions = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ProjectInvitation {
  int64 id = 1;
  int64 project_id = 2;
  string project_title = 3;
  string project_icon = 4;
  string inviter_id = 5;
  string inviter_email = 6;
  string inviter_name = 7;
  string invitee_id = 8;
  string invitee_email = 9;
  repeated string permissions = 10;
  InvitationStatus status = 11;
  string created_at = 12;
  string updated_at = 13;
}

message UserAccessBlock {
  int64 id = 1;
  string user_id = 2;
  string blocked_user_id = 3;
  string blocked_user_email = 4;
  string blocked_user_name = 5;
  string created_at = 6;
}

message SharedProjectItem {
  Project project = 1;
  repeated string permissions = 2;
  string owner_email = 3;
  string owner_name = 4;
  string joined_at = 5;
}

// ─── Приглашения ──────────────────────────────────────────────
message ProjectSendInvitationRequest {
  int64 project_id = 1;
  string invitee_id = 2;
  string invitee_email = 3;
  repeated string permissions = 4;
}

message ProjectSendInvitationResponse {
  ProjectInvitation invitation = 1;
}

message ProjectListIncomingInvitationsRequest {}

message ProjectListIncomingInvitationsResponse {
  repeated ProjectInvitation invitations = 1;
}

message ProjectListOutgoingInvitationsRequest {
  int64 project_id = 1;
}

message ProjectListOutgoingInvitationsResponse {
  repeated ProjectInvitation invitations = 1;
}

message ProjectRespondInvitationRequest {
  int64 invitation_id = 1;
  bool accept = 2;
}

message ProjectRespondInvitationResponse {
  bool success = 1;
}

message ProjectCancelInvitationRequest {
  int64 invitation_id = 1;
}

message ProjectCancelInvitationResponse {
  bool success = 1;
}

// ─── Участники проекта ─────────────────────────────────────────
message ProjectListMembersRequest {
  int64 project_id = 1;
}

message ProjectListMembersResponse {
  repeated ProjectMember members = 1;
  string owner_id = 2;
}

message ProjectUpdateMemberPermissionsRequest {
  int64 project_id = 1;
  string user_id = 2;
  repeated string permissions = 3;
}

message ProjectUpdateMemberPermissionsResponse {
  ProjectMember member = 1;
}

message ProjectRemoveMemberRequest {
  int64 project_id = 1;
  string user_id = 2;
}

message ProjectRemoveMemberResponse {
  bool success = 1;
}

message ProjectLeaveRequest {
  int64 project_id = 1;
}

message ProjectLeaveResponse {
  bool success = 1;
}

message ProjectListSharedProjectsRequest {}

message ProjectListSharedProjectsResponse {
  repeated SharedProjectItem projects = 1;
}

// ─── Блокировка / Черный список ───────────────────────────────
message ProjectBlockUserRequest {
  string blocked_user_id = 1;
  string blocked_user_email = 2;
}

message ProjectBlockUserResponse {
  bool success = 1;
}

message ProjectUnblockUserRequest {
  string blocked_user_id = 1;
}

message ProjectUnblockUserResponse {
  bool success = 1;
}

message ProjectListBlockedUsersRequest {}

message ProjectListBlockedUsersResponse {
  repeated UserAccessBlock blocks = 1;
}

// ─── Service ──────────────────────────────────────────

service ProjectService {
  rpc Create(ProjectCreateRequest) returns (ProjectCreateResponse) {
    option (google.api.http) = { post: "/api/v1/projects", body: "*" };
  }
  rpc Get(ProjectGetRequest) returns (ProjectGetResponse) {
    option (google.api.http) = { get: "/api/v1/projects/{id}" };
  }
  rpc List(ProjectListRequest) returns (ProjectListResponse) {
    option (google.api.http) = { get: "/api/v1/projects" };
  }
  rpc Update(ProjectUpdateRequest) returns (ProjectUpdateResponse) {
    option (google.api.http) = { patch: "/api/v1/projects/{id}", body: "*" };
  }
  rpc Delete(ProjectDeleteRequest) returns (ProjectDeleteResponse) {
    option (google.api.http) = { delete: "/api/v1/projects/{id}" };
  }

  // Загрузка сборок
  rpc UploadBuild(ProjectUploadBuildRequest) returns (ProjectUploadBuildResponse);
  rpc UploadBuildStream(stream ProjectUploadBuildStreamRequest) returns (ProjectUploadBuildResponse);

  rpc ListBuilds(ProjectListBuildsRequest) returns (ProjectListBuildsResponse) {
    option (google.api.http) = { get: "/api/v1/projects/{project_id}/builds" };
  }
  rpc DeleteBuild(ProjectDeleteBuildRequest) returns (ProjectDeleteBuildResponse) {
    option (google.api.http) = { delete: "/api/v1/projects/{project_id}/builds/{version}" };
  }

  // Загрузка медиа
  rpc UploadMedia(ProjectUploadMediaRequest) returns (ProjectUploadMediaResponse);
  rpc UploadMediaStream(stream ProjectUploadMediaStreamRequest) returns (ProjectUploadMediaResponse);

  // Модерация и публикация
  rpc SubmitForModeration(SubmitForModerationRequest) returns (SubmitForModerationResponse) {
    option (google.api.http) = { post: "/api/v1/projects/{project_id}/moderation/submit", body: "*" };
  }
  rpc PublishRelease(ProjectPublishReleaseRequest) returns (ProjectPublishReleaseResponse);
  rpc RejectDraft(ProjectRejectDraftRequest) returns (ProjectRejectDraftResponse);

  rpc GetPublished(ProjectGetPublishedRequest) returns (ProjectGetPublishedResponse) {
    option (google.api.http) = { get: "/api/v1/projects/{id}/published" };
  }
  rpc Unpublish(ProjectUnpublishRequest) returns (ProjectUnpublishResponse) {
    option (google.api.http) = { post: "/api/v1/projects/{id}/unpublish", body: "*" };
  }

  // Приглашения и общий доступ
  rpc SendInvitation(ProjectSendInvitationRequest) returns (ProjectSendInvitationResponse) {
    option (google.api.http) = { post: "/api/v1/projects/{project_id}/invitations", body: "*" };
  }
  rpc ListIncomingInvitations(ProjectListIncomingInvitationsRequest) returns (ProjectListIncomingInvitationsResponse) {
    option (google.api.http) = { get: "/api/v1/invitations/incoming" };
  }
  rpc ListOutgoingInvitations(ProjectListOutgoingInvitationsRequest) returns (ProjectListOutgoingInvitationsResponse) {
    option (google.api.http) = { get: "/api/v1/invitations/outgoing" };
  }
  rpc RespondInvitation(ProjectRespondInvitationRequest) returns (ProjectRespondInvitationResponse) {
    option (google.api.http) = { post: "/api/v1/invitations/{invitation_id}/respond", body: "*" };
  }
  rpc CancelInvitation(ProjectCancelInvitationRequest) returns (ProjectCancelInvitationResponse) {
    option (google.api.http) = { post: "/api/v1/invitations/{invitation_id}/cancel", body: "*" };
  }

  // Участники и доступы
  rpc ListMembers(ProjectListMembersRequest) returns (ProjectListMembersResponse) {
    option (google.api.http) = { get: "/api/v1/projects/{project_id}/members" };
  }
  rpc UpdateMemberPermissions(ProjectUpdateMemberPermissionsRequest) returns (ProjectUpdateMemberPermissionsResponse) {
    option (google.api.http) = { patch: "/api/v1/projects/{project_id}/members/{user_id}", body: "*" };
  }
  rpc RemoveMember(ProjectRemoveMemberRequest) returns (ProjectRemoveMemberResponse) {
    option (google.api.http) = { delete: "/api/v1/projects/{project_id}/members/{user_id}" };
  }
  rpc LeaveProject(ProjectLeaveRequest) returns (ProjectLeaveResponse) {
    option (google.api.http) = { post: "/api/v1/projects/{project_id}/leave", body: "*" };
  }
  rpc ListSharedProjects(ProjectListSharedProjectsRequest) returns (ProjectListSharedProjectsResponse) {
    option (google.api.http) = { get: "/api/v1/projects/shared" };
  }

  // Черный список / Бан спамеров
  rpc BlockUser(ProjectBlockUserRequest) returns (ProjectBlockUserResponse) {
    option (google.api.http) = { post: "/api/v1/access/blocks", body: "*" };
  }
  rpc UnblockUser(ProjectUnblockUserRequest) returns (ProjectUnblockUserResponse) {
    option (google.api.http) = { delete: "/api/v1/access/blocks/{blocked_user_id}" };
  }
  rpc ListBlockedUsers(ProjectListBlockedUsersRequest) returns (ProjectListBlockedUsersResponse) {
    option (google.api.http) = { get: "/api/v1/access/blocks" };
  }
}
