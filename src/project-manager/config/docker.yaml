# Конфигурация для запуска в Docker Compose
env: "docker"

grpc:
  port: 50053

db:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "orchestrator"
  ssl_mode: "disable"

valkey:
  addr: "valkey:6379"
  password: ""
  db: 2

storage:
  driver: "s3" # "s3" (SeaweedFS / S3) или "fs" (локальная файловая система)
  projects_path: "/data/projects"
  max_build_versions: 5
  s3:
    endpoint: "host.docker.internal:8333"
    access_key: ""
    secret_key: ""
    use_ssl: false
    region: "us-east-1"
    games_bucket: "games"
    media_bucket: "media"
    builds_bucket: "builds"

deployment:
  mode: "s3" # "s3" (SeaweedFS / S3), "local" (локальная распаковка в контейнере), "agent" (через gRPC-агент)
  games_base_path: "/data/games"
  url_prefix: "/games"
  agent_endpoint: "game-deployment-agent:50055"
  agent_api_key: "dev-deployment-agent-key"
  platform_proxy_hosts:
    - "wss://*.proxy.welwise.online:*"
    - "https://*.proxy.welwise.online:*"
    - "wss://*.nodes.welwise-games.online:*"
    - "https://*.nodes.welwise-games.online:*"
    - "ws://localhost:*"
    - "wss://localhost:*"
    - "http://localhost:*"
    - "https://localhost:*"
    - "ws://127.0.0.1:*"
    - "wss://127.0.0.1:*"
    - "http://127.0.0.1:*"
    - "https://127.0.0.1:*"

moderation:
  addr: "gdh-moderation:50054"

jwt:
  secret: "dev-jwt-secret-for-local-testing"
  issuer: "sso"
