version: "3"

vars:
  FRONTEND_DIR: "src/frontend"

tasks:
  deps:
    desc: "Install npm dependencies"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm ci

  start:
    desc: "Start development server"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run dev

  prod:
    desc: "Build for production"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run build

  serve:
    desc: "Preview production build"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run preview

  remove:
    desc: "Clean build artifacts"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - cmd: rm -rf node_modules dist
        platforms: [linux, darwin]
      - cmd: powershell -Command "Remove-Item -Recurse -Force node_modules, dist -ErrorAction SilentlyContinue"
        platforms: [windows]

  stats:
    desc: "Count lines of code (excluding node_modules)"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - cloc --exclude-dir=node_modules,.git .

  check:
    desc: "Lint frontend code with ESLint"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run lint

  fix:
    desc: "Fix lint issues and format frontend code"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run lint:fix
      - npm run format

  run-format:
    desc: "Format frontend code with Prettier"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run format

  check-format:
    desc: "Check frontend code formatting with Prettier"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run format:check
