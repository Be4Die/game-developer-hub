# Конфигурация для локальной разработки
env: "local"

grpc:
  port: 50053

db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "orchestrator"
  ssl_mode: "disable"

valkey:
  addr: "localhost:6379"
  password: ""
  db: 2

storage:
  projects_path: "./data/projects"
  max_build_versions: 5

deployment:
  mode: "local" # "local" или "agent"
  games_base_path: "./data/games"
  url_prefix: "/games"
  agent_endpoint: "localhost:50055"
  agent_api_key: "dev-deployment-agent-key"

moderation:
  addr: "" # при пустом адресе используется in-memory StubModerationClient

jwt:
  secret: "dev-jwt-secret-for-local-testing"
  issuer: "sso"
